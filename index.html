<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>Bruno’s Showcase</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=1.3">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">Sélection personnelle</div>
      <h1>Bruno’s Showcase</h1>
    </div>
    <div class="syncDot" id="syncDot" title="Mise à jour automatique"></div>
  </header>

  <main>
    <section id="status" class="status">Chargement…</section>
    <section id="grid" class="watchGrid" aria-live="polite"></section>
    <section id="empty" class="empty" hidden>
      <div class="emptyIcon">⌚</div>
      <h2>Aucune montre à afficher</h2>
      <p>La sélection se met à jour automatiquement.</p>
    </section>
  </main>

  <dialog id="detailDialog" class="detailDialog">
    <div class="detailShell">
      <button class="closeBtn" id="closeDetail" type="button" aria-label="Fermer">×</button>
      <div id="detailContent"></div>
    </div>
  </dialog>

  <script src="cloud.js?v=1.3"></script>
  <script src="app.js?v=1.3"></script>
</body>
</html>
